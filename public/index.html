<!-- Firebase (loaded from the CDN so the modular SDK works without a bundler) -->
<script type="module">
  // Firebase modular SDK, loaded from the CDN so it works in a plain static page (no bundler).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
  import { getFirestore, collection, doc, getDoc, getDocs, setDoc, serverTimestamp, query, where }
    from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyB-AorxBdSdJaz-g3kzROA0xFpeDdgjoCc",
    authDomain: "student-survey-9b441.firebaseapp.com",
    projectId: "student-survey-9b441",
    storageBucket: "student-survey-9b441.firebasestorage.app",
    messagingSenderId: "1061228439255",
    appId: "1:1061228439255:web:45a7507dffd03b8961f292",
    measurementId: "G-M35BP3CWFR"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  try { getAnalytics(app); } catch (e) { /* analytics only reports on authorized https domains */ }
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Give each browser a persistent anonymous identity so we can enforce one
  // response per user. Resolves to the uid, or null if Anonymous auth is off.
  const authReady = new Promise((resolve) => {
    let done = false;
    onAuthStateChanged(auth, (user) => { if (user && !done) { done = true; resolve(user.uid); } });
    signInAnonymously(auth).catch((e) => { console.error('Anonymous sign-in failed:', e && e.code); });
    setTimeout(() => { if (!done) { done = true; resolve(null); } }, 8000);
  });

  // Bridge so the (non-module) survey script below can use Auth + Firestore.
  window.__fb = {
    // Current anonymous uid (waits for sign-in; null if Anonymous auth is disabled).
    uid(){ return authReady; },
    // Has THIS identity already submitted to this collection?
    async hasSubmitted(coll){
      const uid = await authReady;
      if (!uid) return false;
      const snap = await getDoc(doc(db, coll, uid));
      return snap.exists();
    },
    // Save the user's single response: document id = uid, so a second submit is
    // an update — which the security rules forbid (one response per identity).
    async saveResponse(coll, answers){
      const uid = await authReady;
      if (!uid) throw new Error('anonymous sign-in unavailable — enable Anonymous auth in Firebase');
      await setDoc(doc(db, coll, uid), { answers, createdAt: serverTimestamp(), uid });
    },
    // Read every submission's answers from the given collection.
    async loadResponses(coll){
      const snap = await getDocs(collection(db, coll));
      const out = [];
      snap.forEach(d => { const v = d.data(); out.push(v && v.answers ? v.answers : {}); });
      return out;
    },
    // ---- Survey rounds ----
    // Each "round" of a survey stores its responses in its own collection.
    // The "_surveys" collection holds one meta document per round (doc id =
    // the round's collection name): { base, status: 'open'|'closed',
    // openedAt, closedAt, responseCount }.
    async listRuns(base){
      const snap = await getDocs(query(collection(db, '_surveys'), where('base', '==', base)));
      const out = [];
      snap.forEach(d => {
        const v = d.data() || {};
        out.push({
          id: d.id,
          status: v.status === 'open' ? 'open' : 'closed',
          openedAt: (v.openedAt && v.openedAt.toMillis) ? v.openedAt.toMillis() : null,
          closedAt: (v.closedAt && v.closedAt.toMillis) ? v.closedAt.toMillis() : null,
          responseCount: (typeof v.responseCount === 'number') ? v.responseCount : null,
          sheetName: v.sheetName || null,
          class: v.class || null,
          surveyId: v.surveyId || null
        });
      });
      return out;
    },
    async getRunMeta(collName){
      const snap = await getDoc(doc(db, '_surveys', collName));
      return snap.exists() ? snap.data() : null;
    },
    async countResponses(coll){
      const snap = await getDocs(collection(db, coll));
      return snap.size;
    },
    async openRun(collName, meta){
      await setDoc(doc(db, '_surveys', collName),
        { base: meta.base, sheetName: meta.sheetName || null, class: meta.class || null,
          surveyId: meta.surveyId || null,
          status: 'open', openedAt: serverTimestamp() }, { merge: true });
    },
    async closeRun(collName, meta){
      await setDoc(doc(db, '_surveys', collName),
        { base: meta.base, sheetName: meta.sheetName || null, class: meta.class || null,
          surveyId: meta.surveyId || null,
          status: 'closed', closedAt: serverTimestamp(),
          responseCount: (meta.count == null ? null : meta.count) }, { merge: true });
    }
  };
</script>

<script>
// ====== CONFIG ======
// Questions live in one Google Spreadsheet; each tab (sheet) is its own survey.
// You pick the spreadsheet (from its link) and a tab by INDEX (0 = first tab).
// The tab's real NAME is read from the spreadsheet at runtime and used as the
// Firestore collection, so each tab gets its own response set.
let SPREADSHEET_ID = "1Uuip-8Sne2oIQeSaAQmbG_URymBybmE7P5mpjEC1Huo"; // taken from the spreadsheet link
let SHEET_INDEX = 0;                                                // which tab to read (0-based)
let CLASS_VALUE = "";  // admin-set class: only question rows whose "Class" column matches are used
let SURVEYID_VALUE = ""; // admin-set SurveyID: only question rows whose "SurveyID" column matches are used

// Resolved/derived at runtime — don't set these directly.
let SHEET_NAME = "";           // looked up from the spreadsheet for SHEET_INDEX
let QUESTIONS_CSV_URL = "";    // export URL for that tab's gid
let FIRESTORE_COLLECTION = ""; // = sanitized SHEET_NAME
// Legacy: Apps Script web-app URL (fallback only).
let APPS_SCRIPT_URL = "";
// Public Firebase web API key (also used for the read-only Google Sheets metadata lookup).
const FIREBASE_API_KEY = "AIzaSyB-AorxBdSdJaz-g3kzROA0xFpeDdgjoCc";

// Look up the spreadsheet's tabs and return the one at the given 0-based index.
async function resolveSheet(id, index){
  const url="https://sheets.googleapis.com/v4/spreadsheets/"+id
    +"?fields=sheets.properties(title,index,sheetId)&key="+FIREBASE_API_KEY;
  const r=await fetch(url);
  if(!r.ok){
    let msg='sheet lookup failed (HTTP '+r.status+')';
    try{ const e=await r.json(); if(e&&e.error&&e.error.message) msg=e.error.message; }catch(_){}
    throw new Error(msg);
  }
  const d=await r.json();
  const props=(d.sheets||[]).map(s=>s.properties).sort((a,b)=>a.index-b.index);
  if(!props.length) throw new Error('spreadsheet has no tabs');
  if(index<0||index>=props.length) throw new Error('sheet index '+index+' out of range (0–'+(props.length-1)+')');
  const p=props[index];
  return { title:p.title, gid:p.sheetId, total:props.length };
}
// Firestore collection ids can't contain "/" or be "." / "..".
function sanitizeCollection(name){
  const c=(name||'').trim().replace(/\//g,'_');
  return (!c||c==='.'||c==='..') ? '' : c;
}
// Accept either a full spreadsheet link or a bare id.
function extractSheetId(s){
  s=(s||'').trim();
  const m=s.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : s;
}

// ====== DEMO DATA (used when no URL configured) ======
// Question sourced from the Google Sheet (type "multi" = choose all that apply).
const DEMO_QUESTIONS = [
  {id:"1", type:"multi", question:"Why did you choose this major? (choose all that apply.)", options:[
    "It genuinely interests me",
    "Someone else influenced my decision (family, teacher, friend)",
    "Job prospects / career opportunities",
    "I wasn't sure what else to choose",
    "Other (please specify): ___",
  ]},
];
// In-browser response store. Seeded with sample rows (multi answers are arrays); real submissions get appended here too.
let LOCAL_RESPONSES = [
  {"1":["It genuinely interests me","Job prospects / career opportunities"]},
  {"1":["Job prospects / career opportunities"]},
  {"1":["It genuinely interests me"]},
  {"1":["Someone else influenced my decision (family, teacher, friend)","I wasn't sure what else to choose"]},
  {"1":["It genuinely interests me","Someone else influenced my decision (family, teacher, friend)","Job prospects / career opportunities"]},
  {"1":["Job prospects / career opportunities","Other (please specify): ___"],"1__other":"It was the closest program to my hometown"},
];

let QUESTIONS=[], answers={}, demoMode=true, canSave=false, charts=[], alreadySubmitted=false, currentTab='take';

// ---- Survey rounds ----
// A survey can be run in "rounds": the admin begins a round (responses save to a
// fresh, dated collection) and later closes it (submissions stop; the collection
// is kept as that round's archive). The "_surveys" collection tracks the rounds.
let SURVEY_BASE = "";         // sanitized sheet/tab name — groups rounds of the same survey
let SURVEY_RUNS = [];         // round meta docs for SURVEY_BASE (newest first)
let ACTIVE_RUN = null;        // the currently open round, or null (survey closed)
let RESULTS_COLLECTION = "";  // the round collection the Results tab is showing
let RUNS_ERROR = false;       // true when the round lookup itself failed
let confirmingClose = false;  // two-step confirm for the Close-survey button

const $=s=>document.querySelector(s);
const view=$('#view');

(function init(){
  const sid=localStorage_get('pulse_sheet_id'); if(sid) SPREADSHEET_ID=sid;
  if(localStorage_has('pulse_sheet_index')) SHEET_INDEX=parseInt(localStorage_get('pulse_sheet_index'),10)||0;
  if(localStorage_has('pulse_class')) CLASS_VALUE=(localStorage_get('pulse_class')||'').trim();
  if(localStorage_has('pulse_surveyid')) SURVEYID_VALUE=(localStorage_get('pulse_surveyid')||'').trim();
  updateTabsVisibility();   // Results tab is admin-only
  renderAdminPanel();   // builds the settings panel (login form, or the controls if already admin)
  loadQuestions();
})();

// Results are restricted to the admin: the tab only shows when logged in.
function updateTabsVisibility(){
  const t=$('#tabResults'); if(t) t.style.display=isAdmin()?'':'none';
}
// "See the results →" buttons render only for the admin.
function resultsBtn(){
  return isAdmin()?'<button class="btn ghost" onclick="show(\'results\')">See the results →</button>':'';
}

async function loadQuestions(){
  canSave = !!APPS_SCRIPT_URL;
  demoMode = !SPREADSHEET_ID;
  if(demoMode){
    QUESTIONS=DEMO_QUESTIONS; FIRESTORE_COLLECTION=''; alreadySubmitted=false;
    SURVEY_BASE=''; SURVEY_RUNS=[]; ACTIVE_RUN=null; RESULTS_COLLECTION='';
    $('#srcTag').textContent="demo data";
    if($('#sheetNameOut')) $('#sheetNameOut').textContent='';
    renderTake(); return;
  }
  view.innerHTML='<div class="spin"></div>';
  try{
    const meta=await resolveSheet(SPREADSHEET_ID,SHEET_INDEX);          // index -> real tab name + gid
    SHEET_NAME=meta.title;
    // Rounds are grouped per sheet tab + class + SurveyID: each combination
    // is its own survey with its own rounds.
    SURVEY_BASE=sanitizeCollection(SHEET_NAME+(CLASS_VALUE?'_'+CLASS_VALUE:'')+(SURVEYID_VALUE?'_'+SURVEYID_VALUE:''));
    QUESTIONS_CSV_URL="https://docs.google.com/spreadsheets/d/"+SPREADSHEET_ID+"/export?format=csv&gid="+meta.gid;
    LOCAL_RESPONSES=[];
    await refreshRuns();    // sets FIRESTORE_COLLECTION to the open round ('' = closed)
    updateSrcTag();
    const r=await fetch(QUESTIONS_CSV_URL);
    if(!r.ok) throw new Error('questions CSV HTTP '+r.status);
    const text=await r.text();
    QUESTIONS=parseQuestionsCSV(text);
    if(!QUESTIONS.length){
      const f=[];
      if(CLASS_VALUE) f.push('class "'+CLASS_VALUE+'"');
      if(SURVEYID_VALUE) f.push('SurveyID "'+SURVEYID_VALUE+'"');
      throw new Error(f.length
        ? 'no questions for '+f.join(' + ')+' in that tab — check the sheet\'s Class / SurveyID columns'
        : 'no questions parsed from that tab');
    }
    alreadySubmitted=false;
    renderAdminPanel();     // refresh sheet info + round controls in the settings panel
    renderTake();
    checkAlreadySubmitted();   // async: may swap to the "already responded" view
  }catch(e){
    view.innerHTML='<div class="banner err">Could not load the sheet — '+esc(e.message||'check the link, index, and sharing')+'.</div>';
    demoMode=true; QUESTIONS=DEMO_QUESTIONS; FIRESTORE_COLLECTION='';
    SURVEY_BASE=''; SURVEY_RUNS=[]; ACTIVE_RUN=null; RESULTS_COLLECTION='';
    $('#srcTag').textContent="demo data";
    renderAdminPanel();
    setTimeout(renderTake,2000);
  }
}

// Fetch the round list for the current survey and derive the open round.
async function refreshRuns(){
  SURVEY_RUNS=[]; ACTIVE_RUN=null; FIRESTORE_COLLECTION=''; RUNS_ERROR=false;
  if(!SURVEY_BASE) return;
  try{
    const fb=await fbWait();
    if(!fb) throw new Error('Firebase not ready');
    SURVEY_RUNS=await fb.listRuns(SURVEY_BASE);
    SURVEY_RUNS.sort((a,b)=>((b.openedAt||b.closedAt||0)-(a.openedAt||a.closedAt||0)));
    ACTIVE_RUN=SURVEY_RUNS.find(r=>r.status==='open')||null;
    FIRESTORE_COLLECTION=ACTIVE_RUN?ACTIVE_RUN.id:'';
  }catch(e){ RUNS_ERROR=true; console.error('survey round lookup failed:', e); }
}

function updateSrcTag(){
  const el=$('#srcTag'); if(!el) return;
  if(demoMode||!SHEET_NAME){ el.textContent='demo data'; return; }
  // Label the values (e.g. "class 1", "survey 2") unless the value already
  // starts with the word (e.g. "class1" stays as-is).
  const classLabel=CLASS_VALUE?(/^class/i.test(CLASS_VALUE)?CLASS_VALUE:'class '+CLASS_VALUE):'';
  const surveyLabel=SURVEYID_VALUE?(/^survey/i.test(SURVEYID_VALUE)?SURVEYID_VALUE:'survey '+SURVEYID_VALUE):'';
  el.textContent='live · '+SHEET_NAME+(classLabel?' · '+classLabel:'')+(surveyLabel?' · '+surveyLabel:'')+(ACTIVE_RUN?' · open':' · closed');
}

// Parse a Google Sheet CSV into question objects. Supports two layouts:
//   - id | class | surveyid | type | question | options        (options pipe-separated: "A|B|C")
//   - ID | Class | SurveyID | Type | Question | Option1 | ...  (one option per column)
// A "Class" column (2nd) and a "SurveyID" column (3rd) tag each row; when the
// admin has set a class / SurveyID in the settings, only rows matching BOTH
// are used. Any other column that isn't id/class/surveyid/type/question is
// treated as an option cell, so the option count is flexible.
function parseQuestionsCSV(text){
  const rows=parseCSV(text);
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.toLowerCase().trim());
  const ci=name=>head.indexOf(name);
  const idIdx=ci('id'), typeIdx=ci('type'), qIdx=ci('question'), optIdx=ci('options'), classIdx=ci('class');
  let sIdIdx=ci('surveyid'); if(sIdIdx<0) sIdIdx=ci('survey id');
  if(idIdx<0) return [];
  const wanted=CLASS_VALUE.trim().toLowerCase();
  const wantedSid=SURVEYID_VALUE.trim().toLowerCase();
  return rows
    .filter(r=>r[idIdx]&&r[idIdx].trim())
    .filter(r=>{
      if(classIdx>=0&&wanted&&(r[classIdx]||'').trim().toLowerCase()!==wanted) return false;
      if(sIdIdx>=0&&wantedSid&&(r[sIdIdx]||'').trim().toLowerCase()!==wantedSid) return false;
      return true;  // no column / no value set → that filter is skipped
    })
    .map(r=>{
      let options;
      if(optIdx>=0){
        const o=(r[optIdx]||'').trim();
        options=o?o.split('|').map(s=>s.trim()).filter(Boolean):[];
      }else{
        options=r.filter((_,i)=>i!==idIdx&&i!==typeIdx&&i!==qIdx&&i!==classIdx&&i!==sIdIdx).map(s=>(s||'').trim()).filter(Boolean);
      }
      const rawType=typeIdx>=0?(r[typeIdx]||''):'';
      const q={
        id:r[idIdx].trim(),
        type:normalizeType(rawType),
        question:(qIdx>=0?(r[qIdx]||''):'').toString().trim(),
        options
      };
      if(q.type==='short') q.count=shortAnswerCount(rawType);
      return q;
    });
}

// Map free-form sheet "Type" text to an internal question type.
//   Multi-Choise / checkbox     -> multi  (pick many)
//   Single-Choise / radio       -> choice (pick exactly one)
//   scale / rating              -> scale
//   Short Answer N              -> short (N text inputs, labels from the Option columns)
//   text / open / paragraph     -> text
function normalizeType(t){
  t=(t||'').toString().toLowerCase();
  if(/short\s*-?\s*answer/.test(t)) return 'short';
  if(/multi|checkbox|all that apply/.test(t)) return 'multi';
  if(/single|radio|one[\s-]?choice/.test(t)) return 'choice';
  if(/scale|rating|nps|likert/.test(t)) return 'scale';
  if(/text|open|paragraph|long answer|free/.test(t)) return 'text';
  return 'choice';
}
// "Short Answer 3" -> 3 input fields (default 1, capped at 20).
function shortAnswerCount(rawType){
  const m=String(rawType||'').match(/(\d+)/);
  const n=m?parseInt(m[1],10):1;
  return Math.max(1,Math.min(20,isNaN(n)?1:n));
}

// Minimal RFC-4180 CSV parser (handles quotes, commas & newlines inside quotes).
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===',') { row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c!==''));
}

// One response per anonymous identity: check the database and, if this user has
// already submitted to the current collection, switch to the "responded" view.
async function checkAlreadySubmitted(){
  if(!usingDB()) return;
  try{
    const fb=await fbWait(); if(!fb) return;
    if(await fb.hasSubmitted(FIRESTORE_COLLECTION)){
      alreadySubmitted=true;
      if(currentTab==='take') renderTake();
    }
  }catch(e){ /* dedup is best-effort on read; ignore lookup errors */ }
}

// ---------- TAKE ----------
function renderTake(){
  if(!demoMode && SURVEY_BASE && !ACTIVE_RUN){
    // No open round: the survey only accepts responses after the admin
    // presses "Begin survey" in the settings panel.
    const sub = RUNS_ERROR
      ? 'Could not check the survey status — please reload the page.'
      : (SURVEY_RUNS.length
          ? 'This survey is closed and not accepting responses right now.'
          : 'This survey hasn\'t started yet. Please check back later.');
    view.innerHTML=`<div class="center">
      <div class="bignum">◦</div>
      <div class="big">Survey closed</div>
      <p class="sub">${esc(sub)}</p>
      ${SURVEY_RUNS.length?resultsBtn():''}
    </div>`;
    return;
  }
  if(alreadySubmitted){
    view.innerHTML=`<div class="center">
      <div class="bignum">✓</div>
      <div class="big">You've already responded</div>
      <p class="sub">Thanks! This survey accepts one response per person.</p>
      ${resultsBtn()}
    </div>`;
    return;
  }
  let html=`<h1>Tell us what you think.</h1>
    <p class="sub">${QUESTIONS.length} questions · ~2 min${demoMode?' · running on demo data':''}</p>`;
  QUESTIONS.forEach((q,i)=>{
    html+=`<div class="card"><div class="qnum">Question ${i+1}</div>
      <div class="qtext">${esc(q.question)}<span class="req">*</span></div>`;
    if(q.type==='text'){
      html+=`<textarea id="a_${q.id}" placeholder="Type your answer…">${esc(answers[q.id]||'')}</textarea>`;
    }else if(q.type==='short'){
      // "Short Answer N": N one-line inputs; each label comes from the
      // corresponding Option column. 300-character limit per field.
      const vals=Array.isArray(answers[q.id])?answers[q.id]:[];
      for(let k=0;k<(q.count||1);k++){
        const label=q.options[k]||('Answer '+(k+1));
        html+=`<div class="field" style="margin-bottom:10px"><label>${esc(label)}</label>
          <input maxlength="300" id="sa_${q.id}_${k}" value="${esc(vals[k]||'')}"
            oninput="setShort('${q.id}',${k},this.value)" placeholder="Type your answer… (max 300 characters)"></div>`;
      }
    }else if(q.type==='multi'){
      const chosen=Array.isArray(answers[q.id])?answers[q.id]:[];
      html+=`<div class="opts">`;
      q.options.forEach((o,oi)=>{
        const sel=chosen.includes(o)?'sel':'';
        html+=`<label class="opt ${sel}" onclick="toggle('${q.id}',${oi})">
          <input type="checkbox" name="${q.id}" ${sel?'checked':''}> ${esc(o)}</label>`;
        if(isOther(o)&&sel){
          html+=`<input class="other-in" id="other_${q.id}" placeholder="Please specify…" value="${esc(answers[q.id+'__other']||'')}" oninput="setOther('${q.id}',this.value)">`;
        }
      });
      html+=`</div>`;
    }else{
      const cls=q.type==='scale'?'scale':'opts';
      html+=`<div class="${cls}">`;
      q.options.forEach(o=>{
        const sel=answers[q.id]===o?'sel':'';
        html+=`<label class="opt ${sel}" onclick="pick('${q.id}','${esc(o)}')">
          <input type="radio" name="${q.id}" ${sel?'checked':''}> ${esc(o)}</label>`;
        if(q.type!=='scale'&&isOther(o)&&sel){
          html+=`<input class="other-in" id="other_${q.id}" placeholder="Please specify…" value="${esc(answers[q.id+'__other']||'')}" oninput="setOther('${q.id}',this.value)">`;
        }
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  html+=`<div id="msg"></div><button class="btn" onclick="submit()">Submit response →</button>`;
  view.innerHTML=html;
}
function pick(qid,val){ answers[qid]=val; if(!isOther(val)) delete answers[qid+'__other']; renderTake(); }
function toggle(qid,optIndex){
  const q=QUESTIONS.find(x=>x.id===qid); if(!q) return;
  const val=q.options[optIndex];
  const cur=Array.isArray(answers[qid])?answers[qid].slice():[];
  const at=cur.indexOf(val);
  if(at>=0){ cur.splice(at,1); if(isOther(val)) delete answers[qid+'__other']; }
  else cur.push(val);
  answers[qid]=cur;
  renderTake();
}
// An option that invites free text, e.g. "Other (please specify): ___".
function isOther(o){ return /please specify/i.test(o)||/^\s*other\b/i.test(o); }
function setOther(qid,val){ answers[qid+'__other']=val; }
// Store one field of a "Short Answer N" question (300-char cap).
function setShort(qid,k,val){
  const q=QUESTIONS.find(x=>x.id===qid); if(!q) return;
  const cur=Array.isArray(answers[qid])?answers[qid].slice():[];
  while(cur.length<(q.count||1)) cur.push('');
  cur[k]=String(val||'').slice(0,300);
  answers[qid]=cur;
}

async function submit(){
  // collect text + short-answer inputs
  QUESTIONS.forEach(q=>{
    if(q.type==='text'){ const el=$('#a_'+q.id); if(el) answers[q.id]=el.value.trim(); }
    else if(q.type==='short'){
      const vals=[];
      for(let k=0;k<(q.count||1);k++){ const el=$('#sa_'+q.id+'_'+k); vals.push(el?el.value.trim().slice(0,300):(Array.isArray(answers[q.id])?String(answers[q.id][k]||'').trim():'')); }
      answers[q.id]=vals;
    }
  });
  const missing=QUESTIONS.filter(q=>{
    const a=answers[q.id];
    if(q.type==='short') return !Array.isArray(a)||a.length<(q.count||1)||a.some(v=>!v||!String(v).trim());
    return Array.isArray(a)?!a.length:!a;
  });
  if(missing.length){ $('#msg').innerHTML=`<div class="banner err">Please answer all questions (${missing.length} left).</div>`; return; }

  const btn=document.querySelector('.btn'); btn.textContent='Saving…'; btn.disabled=true;

  // If the admin closed the survey while this form was open, don't accept the answer.
  if(!demoMode && SURVEY_BASE){
    try{ await refreshRuns(); }catch(_){}
    updateSrcTag();
    if(!ACTIVE_RUN){ renderTake(); return; }
  }

  const payload={...answers};
  let savedTo=' (this browser only)';
  try{
    if(usingDB()){
      const fb=await fbWait();
      if(!fb) throw new Error('Firebase not ready');
      await fb.saveResponse(FIRESTORE_COLLECTION,payload); // new record in Firestore
      savedTo=' to the database';
    }else if(canSave){
      await fetch(APPS_SCRIPT_URL,{
        method:'POST',
        // Apps Script web apps accept simple requests; text/plain avoids a CORS preflight
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'submit',answers:payload})
      });
      savedTo=' to the sheet';
    }
    LOCAL_RESPONSES.push(payload); // also keep locally for instant results view
  }catch(e){
    const emsg=(e&&e.message)||'';
    if(/permission|already|exist|denied/i.test(emsg)){
      // The rules rejected the write: either the round was just closed, or
      // this identity already submitted (overwrites are forbidden).
      try{ await refreshRuns(); }catch(_){}
      updateSrcTag();
      if(!ACTIVE_RUN){ answers={}; renderTake(); return; }
      alreadySubmitted=true; answers={}; renderTake(); return;
    }
    $('#msg').innerHTML='<div class="banner err">Save failed — '+esc(emsg||'check your database settings and Firestore rules')+'.</div>';
    btn.textContent='Submit response →'; btn.disabled=false; return;
  }
  alreadySubmitted=true; answers={};
  view.innerHTML=`<div class="center">
    <div class="bignum">✓</div>
    <div class="big">Thanks!</div>
    <p class="sub">Your response was recorded${savedTo}. One response per person.</p>
    ${resultsBtn()}
  </div>`;
}

// ---------- RESULTS ----------
async function renderResults(){
  charts.forEach(c=>c.destroy()); charts=[];
  if(!isAdmin()){
    // Presentation-level gate (like the settings panel): results are shown
    // to the logged-in admin only.
    view.innerHTML=`<div class="center">
      <div class="bignum">●</div>
      <div class="big">Results are admin-only</div>
      <p class="sub">Log in under <b>Survey settings</b> (bottom of the page) to view the results.</p>
    </div>`;
    return;
  }
  view.innerHTML='<div class="spin"></div>';
  const live=!demoMode&&!!SURVEY_BASE;
  let responses=[], rounds=[];
  if(live){
    try{
      const fb=await fbWait();
      if(!fb) throw new Error('Firebase not ready');
      await refreshRuns();                 // pick up rounds opened/closed elsewhere
      updateSrcTag();
      rounds=SURVEY_RUNS.slice();
      // Before any round exists, responses live in the plain "{base}" collection.
      if(!rounds.length) rounds=[{id:SURVEY_BASE,status:'open',legacy:true}];
      if(!RESULTS_COLLECTION||!rounds.some(r=>r.id===RESULTS_COLLECTION)){
        const open=rounds.find(r=>r.status==='open');
        RESULTS_COLLECTION=(open||rounds[0]).id;   // default: open round, else newest
      }
      responses=await fb.loadResponses(RESULTS_COLLECTION); // read straight from the database
    }catch(e){
      view.innerHTML='<div class="banner err">Could not read from the database — '+esc(e.message||'check your Firestore rules')+'.</div>';
      return;
    }
  }else if(canSave){
    try{ const r=await fetch(APPS_SCRIPT_URL+"?action=responses"); const d=await r.json(); responses=d.responses||d; }
    catch(e){ responses=LOCAL_RESPONSES.slice(); } // fall back to anything captured this session
  }else{
    responses=LOCAL_RESPONSES.slice();
  }
  if(!live&&!responses.length){ view.innerHTML='<div class="center"><div class="big">No responses yet</div><p class="sub">Be the first to take it.</p></div>'; return; }

  let html=`<h1>The results.</h1>`;
  if(live&&rounds.length>1){
    html+=`<div class="field" style="max-width:460px"><label>Survey round — pick which results to show</label>
      <select id="roundSel" onchange="pickRound(this.value)">`
      +rounds.map(r=>`<option value="${esc(r.id)}"${r.id===RESULTS_COLLECTION?' selected':''}>${esc(roundLabel(r))}</option>`).join('')
      +`</select></div>`;
  }
  const sel=rounds.find(r=>r.id===RESULTS_COLLECTION);
  html+=`<p class="sub">${responses.length} response${responses.length===1?'':'s'}${live&&sel?' · '+esc(roundLabel(sel)):' so far'}</p>`;
  if(demoMode) html+=`<div class="banner demo">Demo mode — add your Questions CSV link to go live.</div>`;
  else if(live) html+=`<div class="banner demo">Live results from the “${esc(RESULTS_COLLECTION)}” collection in Firestore.</div>`;
  else if(!canSave) html+=`<div class="banner demo">Reading questions from your sheet. Responses are kept in this browser only — set a Firestore collection to save them to the database.</div>`;
  if(live&&!responses.length){
    html+='<div class="center"><div class="big">No responses yet</div><p class="sub">'
      +(sel&&sel.status==='open'?'Be the first to take it.':'This round recorded no responses.')+'</p></div>';
    view.innerHTML=html; return;
  }
  view.innerHTML=html;

  QUESTIONS.forEach(q=>{
    const card=document.createElement('div'); card.className='card';
    const metaLabel=q.type==='short'?('short answer × '+(q.count||1)):q.type;
    card.innerHTML=`<div class="res-q">${esc(q.question)}</div><div class="res-meta">${esc(metaLabel)}</div>`;
    if(q.type==='text'){
      const box=document.createElement('div'); box.className='texts';
      const ans=responses.map(r=>r[q.id]).filter(Boolean);
      box.innerHTML = ans.length? ans.map(a=>`<div class="t">${esc(a)}</div>`).join('') : '<div class="res-meta">No text answers.</div>';
      card.appendChild(box);
    }else if(q.type==='short'){
      // One list per input field, headed by its Option-column label.
      for(let k=0;k<(q.count||1);k++){
        const label=q.options[k]||('Answer '+(k+1));
        const box=document.createElement('div'); box.className='texts'; if(k) box.style.marginTop='14px';
        const ans=responses
          .map(r=>{ const v=r[q.id]; return Array.isArray(v)?v[k]:(k===0?v:null); })
          .filter(v=>v!=null&&String(v).trim()!=='');
        box.innerHTML='<div class="res-meta">'+esc(label)+'</div>'
          +(ans.length?ans.map(a=>`<div class="t">${esc(a)}</div>`).join(''):'<div class="res-meta">No answers.</div>');
        card.appendChild(box);
      }
    }else{
      const counts={}; q.options.forEach(o=>counts[o]=0);
      responses.forEach(r=>{
        const v=r[q.id];
        if(v==null||v==='') return;
        if(Array.isArray(v)) v.forEach(o=>{ if(o!=null&&o!=='') counts[o]=(counts[o]||0)+1; });
        else counts[v]=(counts[v]||0)+1;
      });
      const cv=document.createElement('div'); cv.className='chartbox';
      const cvs=document.createElement('canvas'); cv.appendChild(cvs); card.appendChild(cv);
      const others=responses.map(r=>r[q.id+'__other']).filter(v=>v!=null&&String(v).trim()!=='');
      if(others.length){
        const ob=document.createElement('div'); ob.className='texts'; ob.style.marginTop='14px';
        ob.innerHTML='<div class="res-meta">Other (please specify)</div>'+others.map(a=>`<div class="t">${esc(a)}</div>`).join('');
        card.appendChild(ob);
      }
      view.appendChild(card);
      charts.push(makeChart(cvs,q,counts));
      return;
    }
    view.appendChild(card);
  });
}

function makeChart(canvas,q,counts){
  const labels=Object.keys(counts), data=Object.values(counts);
  const palette=['#e8542b','#1f6f5c','#d9a441','#3a6ea5','#9c4f96','#6f6657'];
  const isScale=q.type==='scale';
  return new Chart(canvas,{
    type:isScale?'bar':'doughnut',
    data:{labels,datasets:[{data,
      backgroundColor:isScale?'#1f6f5c':labels.map((_,i)=>palette[i%palette.length]),
      borderColor:'#fbf8f1',borderWidth:isScale?0:3,borderRadius:isScale?6:0}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:!isScale,position:'right',onClick:()=>{},labels:{font:{family:'Spline Sans Mono',size:11},color:'#15130e'}}},
      scales:isScale?{y:{beginAtZero:true,ticks:{precision:0,color:'#6f6657'}},x:{ticks:{color:'#15130e'}}}:{}
    }
  });
}

// ---------- helpers ----------
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// ---------- ADMIN GATE ----------
// The survey settings (which spreadsheet / sheet to use) are editable only by an
// admin. This is presentation-level gating: the password is checked client-side
// against a SHA-256 hash, which hides/locks the controls from respondents. Actual
// data protection is enforced by the Firestore security rules, not by this.
const ADMIN_USER = "admin";
// SHA-256 of the admin password. Default password is "hksyu2026".
// To change it: hash the new password with SHA-256 and replace this value.
const ADMIN_PASS_SHA256 = "fcf085318cc8c17f3d401023658691bf7f5ac8737f7ee32bdf7c283a03daf7f8";

function isAdmin(){ return localStorage_get('pulse_admin')==='1'; }

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function adminLogin(){

  let ok=false;

  if(ok){
    localStorage_set('pulse_admin','1');
    renderAdminPanel(); updateTabsVisibility();
    if(currentTab==='results') renderResults();   // swap the "admin-only" notice for the charts
  }
  else{ const m=$('#admMsg'); if(m){ m.textContent='Wrong username or password.'; m.style.display='block'; } }
}

function adminLogout(){

// Begin a new round: responses start saving to a fresh, dated collection.
async function beginSurvey(){
  try{
    roundBusy('Starting…');
    const fb=await fbWait();
    if(!fb) throw new Error('Firebase not ready');
    if(await fb.uid()==null) throw new Error('anonymous sign-in unavailable — enable Anonymous auth in Firebase');
    // First time using rounds: if the old plain collection already has
    // responses, register it as a closed round so that data stays visible.
    if(!SURVEY_RUNS.length){
      let n=0; try{ n=await fb.countResponses(SURVEY_BASE); }catch(_){}
      if(n>0) await fb.closeRun(SURVEY_BASE, {base:SURVEY_BASE, sheetName:SHEET_NAME, class:CLASS_VALUE||null, surveyId:SURVEYID_VALUE||null, count:n});
    }
    // e.g. "2026-08-17_143205_DSA213 Game Programming Studio_class1_s1";
    // never reuse an existing round's collection.
    const stamp=runStamp();
    const suffix=SHEET_NAME+(CLASS_VALUE?'_'+CLASS_VALUE:'')+(SURVEYID_VALUE?'_'+SURVEYID_VALUE:'');
    let name=sanitizeCollection(stamp+'_'+suffix), k=2;
    while(SURVEY_RUNS.some(r=>r.id===name)) name=sanitizeCollection(stamp+'_'+suffix)+'-'+(k++);
    await fb.openRun(name, {base:SURVEY_BASE, sheetName:SHEET_NAME, class:CLASS_VALUE||null, surveyId:SURVEYID_VALUE||null});
    await refreshRuns();
    alreadySubmitted=false; answers={}; RESULTS_COLLECTION=name; confirmingClose=false;
    updateSrcTag(); renderRoundBox();
    currentTab==='take'?renderTake():renderResults();
    checkAlreadySubmitted();   // this admin may have answered an earlier round; re-check for the new one
  }catch(e){ renderRoundBox(); roundErr('Could not begin the survey — '+((e&&e.message)||'unknown error')); }
}

// Close the current round: submissions stop; its collection is the archive.
async function closeSurvey(){
  try{
    roundBusy('Closing…');
    const fb=await fbWait();
    if(!fb||!ACTIVE_RUN) throw new Error('Firebase not ready');
    const id=ACTIVE_RUN.id;
    let n=null; try{ n=await fb.countResponses(id); }catch(_){}
    await fb.closeRun(id, {base:SURVEY_BASE, count:n,
      sheetName:ACTIVE_RUN.sheetName||SHEET_NAME, class:ACTIVE_RUN.class||CLASS_VALUE||null,
      surveyId:ACTIVE_RUN.surveyId||SURVEYID_VALUE||null});
    confirmingClose=false;
    await refreshRuns();
    RESULTS_COLLECTION=id;    // Results opens on the round that was just closed
    updateSrcTag(); renderRoundBox();
    currentTab==='take'?renderTake():renderResults();
  }catch(e){ renderRoundBox(); roundErr('Could not close the survey — '+((e&&e.message)||'unknown error')); }
}

function roundErr(msg){ const m=$('#roundMsg'); if(m){ m.textContent=msg; m.style.display='block'; } }
function roundBusy(label){
  const box=$('#roundBox'); if(!box) return;
  box.querySelectorAll('button').forEach(b=>{ b.disabled=true; });
  const m=$('#roundMsg'); if(m){ m.textContent=label; m.style.display='block'; }
}

// "Sheet1__2026-08-17_143205" — local date/time stamp used in round collection names.
function runStamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

function fmtDate(ms){
  if(!ms) return '';
  const d=new Date(ms);
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})
    +', '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}

// Human label for a round in the Results dropdown: just the collection name
// (it already encodes date_sheetName_class) plus the response count.
function roundLabel(r){
  if(r.legacy) return r.id+' — all responses';
  if(r.status==='open') return 'Current — '+r.id;
  let l=r.id;
  if(r.responseCount!=null) l+=' · '+r.responseCount+' response'+(r.responseCount===1?'':'s');
  return l;
}

function pickRound(id){ RESULTS_COLLECTION=id; renderResults(); }

function saveCfg(){
  SPREADSHEET_ID=extractSheetId($('#cfgSheetLink').value);
  let idx=parseInt($('#cfgSheetIndex').value,10); if(isNaN(idx)||idx<0) idx=0;
  SHEET_INDEX=idx;
  CLASS_VALUE=(($('#cfgClass')&&$('#cfgClass').value)||'').trim();
  SURVEYID_VALUE=(($('#cfgSurveyId')&&$('#cfgSurveyId').value)||'').trim();
  localStorage_set('pulse_sheet_id',SPREADSHEET_ID);
  localStorage_set('pulse_sheet_index',String(SHEET_INDEX));
  localStorage_set('pulse_class',CLASS_VALUE);
  localStorage_set('pulse_surveyid',SURVEYID_VALUE);
  if($('#cfgSheetIndex')) $('#cfgSheetIndex').value=SHEET_INDEX;
  answers={}; RESULTS_COLLECTION=''; loadQuestions();
}

// True when responses should be saved to / read from Firestore.
function usingDB(){ return !!FIRESTORE_COLLECTION; }
// The Firebase bridge loads as a deferred module; wait briefly for it on first use.
function fbWait(ms){
  ms=ms||5000;
  return new Promise(res=>{
    if(window.__fb) return res(window.__fb);
    const start=Date.now();
    const iv=setInterval(()=>{
      if(window.__fb||Date.now()-start>ms){ clearInterval(iv); res(window.__fb||null); }
    },50);
  });
}

// in-memory shim (artifact sandboxes block localStorage)
const _mem={};
function localStorage_get(k){try{return localStorage.getItem(k)}catch(e){return _mem[k]||''}}
function localStorage_set(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=v}}
function localStorage_has(k){try{return localStorage.getItem(k)!==null}catch(e){return Object.prototype.hasOwnProperty.call(_mem,k)}}
</script>
